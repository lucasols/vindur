[workspace]
members = ["crates/vindur_compiler", "crates/vindur_node"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/lucasols/vindur"
rust-version = "1.94"

[workspace.dependencies]
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_ast_visit = "0.139.0"
oxc_diagnostics = "0.139.0"
oxc_ecmascript = "0.139.0"
oxc_parser = "0.139.0"
oxc_resolver = "=11.23.0"
oxc_semantic = "0.139.0"
oxc_span = "0.139.0"
oxc_syntax = "0.139.0"
napi = { version = "3.12.0", default-features = false, features = ["napi8"] }
napi-derive = "3.6.1"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
